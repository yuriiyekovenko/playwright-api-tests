name: API Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
permissions:
    contents: read
jobs:
    test:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        services:
            petclinic:
                image: springcommunity/spring-petclinic-rest:4.0.2
                env:
                    PETCLINIC_SECURITY_ENABLE: 'true'
                ports:
                    - 9966:9966
        env:
            API_BASE_URL: http://localhost:9966
            API_ADMIN_USERNAME: admin
            API_ADMIN_PASSWORD: admin
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Wait for PetClinic API
              run: |
                  curl --fail \
                  --retry-connrefused \
                  --user "$API_ADMIN_USERNAME:$API_ADMIN_PASSWORD" \
                  --retry 20 \
                  --retry-delay 2 \
                  "$API_BASE_URL/petclinic/actuator/health"

            - name: Run Playwright tests
              run: npx playwright test

            - name: Publish test results
              uses: dorny/test-reporter@v3
              if: ${{ !cancelled() }}
              with:
                  name: Playwright results
                  path: test-results/junit.xml
                  reporter: java-junit
                  fail-on-error: false

            - uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30

            - name: Upload report for GitHub Pages
              uses: actions/upload-pages-artifact@v5
              if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              with:
                  path: playwright-report/

    deploy-report:
        needs: test
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - name: Deploy report to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
