name: API Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    test:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        services:
            petclinic:
                image: springcommunity/spring-petclinic-rest
                env:
                    PETCLINIC_SECURITY_ENABLE: 'true'
                ports:
                    - 9966:9966
        env:
            API_BASE_URL: http://localhost:9966
            API_ADMIN_USERNAME: admin
            API_ADMIN_PASSWORD: admin
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Wait for PetClinic API
              run: |
                  curl --fail \
                  --retry-connrefused \
                  --user "$API_ADMIN_USERNAME:$API_ADMIN_PASSWORD" \
                  --retry 20 \
                  --retry-delay 2 \
                  "$API_BASE_URL/petclinic/actuator/health"

            - name: Run Playwright tests
              run: npx playwright test

            - uses: actions/upload-artifact@v6
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
